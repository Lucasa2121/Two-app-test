<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075aa8"><title>Cherrydale Point OWS306</title><link rel="manifest" href="./manifest.webmanifest"><style>body{font:16px system-ui;margin:0;background:#f1f5f9;color:#152238}header{background:#075aa8;color:white;padding:16px}main{max-width:1100px;margin:20px auto;padding:0 16px}.card{background:white;border-radius:14px;padding:22px;box-shadow:0 2px 12px #0001;margin-bottom:15px}button,input{font:inherit;padding:10px;margin:6px 0}button{background:#075aa8;color:white;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}.error{color:#b91c1c}iframe{width:100%;height:80vh;border:0;background:white}nav{display:flex;gap:10px}label{display:block}#app,#switcher,#signout{display:none}</style></head><body><header><strong>Cherrydale Point OWS306</strong> · Unified Test App <button id="signout" style="float:right">Sign out</button></header><main><section class="card" id="login"><h1>Sign in</h1><p>Use your existing Cherrydale account.</p><form id="loginForm"><label>Email<input type="email" id="email" autocomplete="username" required></label><label>Password<input type="password" id="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form><p id="loginError" class="error" role="alert"></p></section><section id="app"><nav class="card" id="switcher"><button id="managementButton">Management Dashboard</button><button id="employeeButton">My Employee Dashboard</button></nav><section class="card"><h2 id="dashboardTitle">Dashboard</h2><p id="dashboardStatus" role="status">Checking account permissions…</p></section><iframe id="dashboard" title="Cherrydale dashboard"></iframe></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const config={supabaseUrl:'https://nrysdyykkqpsxefmoibt.supabase.co',supabaseAnonKey:'sb_publishable_wfZmj5HeN1gbmlAYIBR8tw_M1GEH1Hk'};
const $=id=>document.getElementById(id);
let supabase=null,activeRole=null,viewRequest=0;
function error(message){$('loginError').textContent=message}
function showLogin(){viewRequest++;activeRole=null;$('app').style.display='none';$('login').style.display='block';$('signout').style.display='none';$('dashboard').removeAttribute('src')}
async function showDashboard(kind){const request=++viewRequest;const {data:{user},error:authError}=await supabase.auth.getUser();if(request!==viewRequest)return;if(authError||!user){showLogin();return}const {data:profile,error:profileError}=await supabase.from('team_profiles').select('role,active').eq('user_id',user.id).single();if(request!==viewRequest)return;if(profileError||!profile?.active||profile.role!==activeRole){showLogin();error('Account permissions changed. Please sign in again.');return}if(kind==='management'&&profile.role!=='admin')return;$('dashboardTitle').textContent=kind==='management'?'Management Dashboard':'My Employee Dashboard';$('dashboardStatus').textContent='Existing dashboard loaded for migration testing. Backend permissions still require verification.';$('dashboard').src=kind==='management'?'./admin.html':'./employee.html'}
async function loadAccount(){const {data:{user},error:sessionError}=await supabase.auth.getUser();if(sessionError||!user){showLogin();return}const {data,error:roleError}=await supabase.from('team_profiles').select('role,active').eq('user_id',user.id).single();if(roleError||!data?.active||!['admin','employee'].includes(data.role)){showLogin();error('Unable to verify your account role. Contact Management.');return}activeRole=data.role;$('login').style.display='none';$('app').style.display='block';$('signout').style.display='inline-block';$('switcher').style.display=activeRole==='admin'?'flex':'none';showDashboard(activeRole==='admin'?'management':'employee')}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();error('');if(!supabase)return;const {error:authError}=await supabase.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(authError){error('Sign-in failed. Check your credentials.');return}await loadAccount()});
$('signout').addEventListener('click',async()=>{$('dashboard').removeAttribute('src');await supabase?.auth.signOut();$('password').value='';showLogin()});
$('managementButton').addEventListener('click',()=>showDashboard('management'));$('employeeButton').addEventListener('click',()=>showDashboard('employee'));
if(!config.supabaseUrl||!config.supabaseAnonKey){error('Test configuration missing. This shell is not connected to Supabase yet.');}else{supabase=createClient(config.supabaseUrl,config.supabaseAnonKey);supabase.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){showLogin()}else if(event==='USER_UPDATED'){void loadAccount()}});void loadAccount();}
</script></body></html>
